name: Kara target

on:
  push:
    paths:
      - "kara/**"
      - ".github/workflows/kara.yml"
  pull_request:
    paths:
      - "kara/**"
      - ".github/workflows/kara.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    container: ubuntu:25.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install host and ARM compilers
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential file gcc-arm-linux-gnueabihf
      - name: Run host tests
        run: ./kara/tests/run-host-tests.sh
      - name: Build the experimental newer-firmware ARM artifact
        run: ./kara/build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kara-ghostlock-experimental-newer
          path: kara/out/kara-ghostlock-experimental-newer.arm
          if-no-files-found: error
